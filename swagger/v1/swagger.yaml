  "/api/v1/transfers":
    get:
      summary: List transfers with both sides' details
      tags:
      - Transfers
      description: Newest first, at most 200.
      parameters:
      - name: confirmed
        in: query
        schema:
          type: boolean
        required: false
        description: true = confirmed only, false = candidates only, omit = all
      responses:
        '200':
          description: transfers listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TransferWithDetails"
    post:
      summary: Create a transfer link (a matched pair, or one side + counterparty
        account)
      tags:
      - Transfers
      parameters: []
      responses:
        '201':
          description: transfer created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transfer"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Provide both transaction sides (pair transfer), or exactly
                one side plus counterparty_account_id (one-sided transfer).
              properties:
                from_transaction_id:
                  type: string
                  format: uuid
                from_transaction_type:
                  type: string
                  enum:
                  - CashTransaction
                  - InvestmentTransaction
                to_transaction_id:
                  type: string
                  format: uuid
                to_transaction_type:
                  type: string
                  enum:
                  - CashTransaction
                  - InvestmentTransaction
                counterparty_account_id:
                  type: string
                  format: uuid
                  description: Account on the untracked side. Required when only one
                    transaction side is given; must be blank when both sides are given.
                amount:
                  type: number
                note:
                  type: string
                kind:
                  type: string
                  enum:
                  - transfer
                  - credit_card_payment
                  - loan_payment
                  description: Classified from the legs when omitted
                include_in_spend:
                  type: boolean
                auto_confirm:
                  type: boolean
                  description: Confirm immediately if true
              required:
              - amount
  "/api/v1/transfers/candidates":
    get:
      summary: List unconfirmed (candidate) transfers detected automatically
      tags:
      - Transfers
      responses:
        '200':
          description: candidates listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TransferWithDetails"
  "/api/v1/transfers/for_transaction":
    get:
      summary: Find the transfer (confirmed or candidate) linked to a transaction
      tags:
      - Transfers
      parameters:
      - name: transaction_id
        in: query
        schema:
          type: string
          format: uuid
        required: true
      - name: transaction_type
        in: query
        schema:
          type: string
          enum:
          - CashTransaction
          - InvestmentTransaction
        required: true
      responses:
        '200':
          description: transfer found (or null if none)
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                - "$ref": "#/components/schemas/TransferWithDetails"
  "/api/v1/transfers/scan":
    post:
      summary: Enqueue the transfer-detection job
      tags:
      - Transfers
      description: Scans all recent transactions asynchronously for matching debit/credit
        pairs and creates candidate Transfer records.
      responses:
        '202':
          description: scan queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - queued
                required:
                - status
  "/api/v1/transfers/{id}":
    parameters:
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    patch:
      summary: Edit a transfer's treatment or note
      tags:
      - Transfers
      description: The linked sides are immutable; relink by deleting and recreating.
      parameters: []
      responses:
        '200':
          description: transfer updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transfer"
        '422':
          description: unknown kind
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - transfer
                  - credit_card_payment
                  - loan_payment
                include_in_spend:
                  type: boolean
                note:
                  type: string
                  nullable: true
    delete:
      summary: Delete a transfer link
      tags:
      - Transfers
      description: Removes the transfer record and clears transfer_id on both linked
        transactions.
      responses:
        '204':
          description: transfer deleted
