security:
- bearerAuth: []
paths:
  "/api/v1/brokers":
    get:
      summary: List brokers
      tags:
      - Brokers
      responses:
        '200':
          description: brokers listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Broker"
    post:
      summary: Create a broker
      tags:
      - Brokers
      parameters: []
      responses:
        '201':
          description: broker created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Broker"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
  "/api/v1/brokers/{id}":
    parameters:
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    get:
      summary: Fetch a broker with its accounts
      tags:
      - Brokers
      responses:
        '200':
          description: broker found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BrokerDetail"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update a broker
      tags:
      - Brokers
      parameters: []
      responses:
        '200':
          description: broker updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Broker"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
    delete:
      summary: Delete a broker
      tags:
      - Brokers
      responses:
        '204':
          description: broker deleted
        '422':
          description: broker still has accounts
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/accounts":
    get:
      summary: List accounts with ledger stats
      tags:
      - Accounts
      responses:
        '200':
          description: accounts listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/AccountWithStats"
    post:
      summary: Create an account
      tags:
      - Accounts
      parameters: []
      responses:
        '201':
          description: account created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                account_number:
                  type: string
                account_type:
                  type: string
                  nullable: true
                broker_id:
                  type: string
                  format: uuid
                  nullable: true
                balance:
                  type: number
                  nullable: true
                  description: Recording a manual balance also writes a balance snapshot
                balance_currency:
                  type: string
                balance_usd:
                  type: number
                  nullable: true
                hidden:
                  type: boolean
                kind:
                  type: string
                  enum:
                  - standard
                  - external
                tax_treatment:
                  type: string
                  enum:
                  - taxable
                  - traditional_401k
                  - traditional_ira
                  - roth_401k
                  - roth_ira
                  - hsa
                  - education
                  - other
              required:
              - name
              - account_number
  "/api/v1/accounts/{id}":
    parameters:
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    get:
      summary: Fetch an account
      tags:
      - Accounts
      responses:
        '200':
          description: account found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update an account
      tags:
      - Accounts
      parameters: []
      responses:
        '200':
          description: account updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                account_number:
                  type: string
                account_type:
                  type: string
                  nullable: true
                broker_id:
                  type: string
                  format: uuid
                  nullable: true
                balance:
                  type: number
                  nullable: true
                  description: Recording a manual balance also writes a balance snapshot
                balance_currency:
                  type: string
                balance_usd:
                  type: number
                  nullable: true
                hidden:
                  type: boolean
                kind:
                  type: string
                  enum:
                  - standard
                  - external
                tax_treatment:
                  type: string
                  enum:
                  - taxable
                  - traditional_401k
                  - traditional_ira
                  - roth_401k
                  - roth_ira
                  - hsa
                  - education
                  - other
  "/api/v1/activity":
    get:
      summary: The activity log (paged), or episodes grouped by trace
      tags:
      - Activity
      parameters:
      - name: source
        in: query
        required: false
        description: Comma-separated sources
        schema:
          type: string
      - name: severity
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/ActivitySeverity"
      - name: subject_type
        in: query
        required: false
        schema:
          type: string
      - name: subject_id
        in: query
        format: uuid
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: grouped
        in: query
        required: false
        description: Any value switches the response to ActivityGroupsResponse
        schema:
          type: string
      responses:
        '200':
          description: entries (ActivityResponse), or grouped episodes (ActivityGroupsResponse)
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ActivityResponse"
