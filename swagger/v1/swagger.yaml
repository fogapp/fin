    post:
      summary: Filter cash transactions by a condition set
      tags:
      - Cash Transactions
      description: The workflow editor's condition preview. Returns a bare array,
        or {transactions, total} when `count` is set.
      parameters: []
      responses:
        '200':
          description: filtered transactions
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    "$ref": "#/components/schemas/CashTransaction"
                - "$ref": "#/components/schemas/CashTransactionFilterCount"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      operator:
                        type: string
                      value:
                        type: string
                    required:
                    - field
                    - operator
                match_all:
                  type: boolean
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                count:
                  type: boolean
                  description: Also return the full match count
              required:
              - conditions
