  "/api/v1/cash_transactions":
    get:
      summary: List cash transactions
      tags:
      - Cash Transactions
      description: Newest first. Windowed with limit/offset; an omitted limit serves
        at most 1,000 rows.
      parameters:
      - name: source
        in: query
        schema:
          type: string
          enum:
          - bank
          - credit_card
        required: false
        description: Filter by source
      - name: merchant_id
        in: query
        schema:
          type: string
          format: uuid
        required: false
      - name: category_id
        in: query
        schema:
          type: string
          format: uuid
        required: false
        description: Includes the category's subcategories
      - name: category_ids
        in: query
        schema:
          type: string
        required: false
        description: Comma-separated exact category ids (no rollup); wins over category_id
      - name: account_id
        in: query
        schema:
          type: string
          format: uuid
        required: false
      - name: loan_id
        in: query
        schema:
          type: string
          format: uuid
        required: false
      - name: tag_id
        in: query
        schema:
          type: string
          format: uuid
        required: false
      - name: exclude_tag_ids
        in: query
        schema:
          type: string
        required: false
        description: Comma-separated tag ids to leave out
      - name: transaction_type
        in: query
        schema:
          type: string
        required: false
      - name: description
        in: query
        schema:
          type: string
        required: false
        description: Case-insensitive substring match
      - name: start_date
        in: query
        schema:
          type: string
          format: date
        required: false
        description: 'Inclusive lower bound on transaction_date (alias: from)'
      - name: end_date
        in: query
        schema:
          type: string
          format: date
        required: false
        description: 'Inclusive upper bound on transaction_date (alias: to)'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
        required: false
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
        required: false
      responses:
        '200':
          description: transactions listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/CashTransaction"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Create a cash transaction
      tags:
      - Cash Transactions
      parameters: []
      responses:
        '201':
          description: transaction created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CashTransaction"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  enum:
                  - bank
                  - credit_card
                transaction_date:
                  type: string
                  format: date
                post_date:
                  type: string
                  format: date
                description:
                  type: string
                amount:
                  type: number
                transaction_type:
                  type: string
                source_row_hash:
                  type: string
                category_id:
                  type: string
                  format: uuid
                merchant_id:
                  type: string
                  format: uuid
                account_id:
                  type: string
                  format: uuid
                loan_id:
                  type: string
                  format: uuid
                balance:
                  type: number
                memo:
                  type: string
              required:
              - source
              - transaction_date
              - amount
              - source_row_hash
  "/api/v1/cash_transactions/{id}":
