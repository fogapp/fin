  "/api/v1/net_worth":
    get:
      summary: Net worth timeline
      tags:
      - Net Worth
      description: Household net worth over time, reconstructed from account balance
        snapshots, position-based portfolio history, loan payment replay, real estate
        valuations, and equity compensation. Credit and loans are negative so liabilities
        stack below zero.
      parameters:
      - name: range
        in: query
        schema:
          type: string
          enum:
          - 3m
          - ytd
          - 1y
          - all
        required: false
        description: Named window for the series and breakdown (default 1y); ignored
          when from is given
      - name: from
        in: query
        required: false
        description: ISO start date of an explicit window (takes precedence over range)
        schema:
          type: string
      - name: to
        in: query
        required: false
        description: 'ISO end date of an explicit window (default and maximum: today)'
        schema:
          type: string
      responses:
        '200':
          description: net worth data
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NetWorthData"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
