  "/api/v1/investment_lots/generate":
    post:
      summary: Auto-generate lots from investment transactions
      tags:
      - Investment Lots
      description: |
        Previews or commits FIFO lots derived from buy/sell transactions.
        Pass `commit: true` to persist. Committing over existing lots needs
        `replace: true`, otherwise it answers 409 with the existing count.
      parameters: []
      responses:
        '200':
          description: preview of lots to generate
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/InvestmentLotPreview"
        '201':
          description: lots committed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/InvestmentLot"
        '409':
          description: lots already exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - lots_exist
                  count:
                    type: integer
                required:
                - error
                - count
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                security_id:
                  type: string
                  format: uuid
                commit:
                  type: boolean
                  description: 'Persist the generated lots (default: preview only)'
                replace:
                  type: boolean
                  description: Replace existing lots when committing
              required:
              - security_id
