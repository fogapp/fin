---
openapi: 3.0.1
info:
  title: Fin API
  version: v1
  description: Personal finance API — investments, spending, merchant rules, and Plaid
    sync.
servers:
- url: "/"
  description: Current host
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token issued from the admin panel
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    ValidationErrors:
      type: object
      properties:
        error:
          type: string
          description: The first validation message
        errors:
          type: array
          items:
            type: string
      required:
      - error
      - errors
    Security:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticker:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        cusip:
          type: string
          nullable: true
        security_type:
          type: string
          nullable: true
        display_name:
          type: string
      required:
      - id
      - display_name
    Import:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_filename:
          type: string
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        kind:
          type: string
          enum:
          - transactions
          - holdings
          - unknown
          - credit_card
          - checking
          - spreadsheet
          nullable: true
        broker_name:
          type: string
          nullable: true
        target_account_id:
          type: string
          format: uuid
          nullable: true
        imported_count:
          type: integer
          nullable: true
        skipped_count:
          type: integer
          nullable: true
        error_count:
          type: integer
          nullable: true
        error_log:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - source_filename
      - status
      - kind
      - broker_name
      - target_account_id
      - imported_count
      - skipped_count
      - error_count
      - error_log
      - started_at
      - finished_at
      - created_at
    ImportPreview:
      type: object
      description: 'A dry read of a file or sheet: its format, whether it can be imported,
        and what''s wrong if not'
      properties:
        format:
          type: string
          enum:
          - transactions
          - holdings
          - unknown
          - credit_card
          - checking
          - spreadsheet
        format_label:
          type: string
        ready:
          type: boolean
          description: Whether importing now would bring in at least one row
        headers:
          type: array
          items:
            type: string
          description: Row 1 as the file has it
        row_count:
          type: integer
          description: Non-blank rows under the header
        invalid_row_count:
          type: integer
          description: Rows that won't import (spreadsheet format only)
        imports_as:
          type: string
          enum:
          - bank
          - credit_card
          nullable: true
        columns:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              required:
                type: boolean
              found:
                type: string
                nullable: true
                description: The header that supplies this column
            required:
            - name
            - required
            - found
        suggestions:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
            required:
            - from
            - to
        problems:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
                nullable: true
                description: The sheet's row number; null for the file as a whole
              message:
                type: string
            required:
            - row
            - message
        sample:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              date:
                type: string
                format: date
                nullable: true
              description:
                type: string
              amount:
                type: number
              type:
                type: string
            required:
            - row
            - date
            - description
            - amount
            - type
      required:
      - format
      - format_label
      - ready
      - headers
      - row_count
      - invalid_row_count
      - imports_as
      - columns
      - suggestions
      - problems
      - sample
    SpreadsheetFormat:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              required:
                type: boolean
              description:
                type: string
              example:
                type: string
            required:
            - name
            - required
            - description
            - example
        split_amount:
          type: string
        notes:
          type: array
          items:
            type: string
      required:
      - columns
      - split_amount
      - notes
    InvestmentSummary:
      type: object
      properties:
        totals:
          type: object
          additionalProperties:
            type: number
        recent:
          type: array
          items:
            type: object
    ApiToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        scope:
          type: string
          enum:
          - full
          - read
          description: full does whatever its user can; read answers GET, HEAD and
            the MCP tools only
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - scope
      - last_used_at
      - expires_at
      - created_at
    Issue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          nullable: true
          description: Stable dedup key, e.g. reconciliation:<account>:<security>
        title:
          type: string
        body:
          type: string
          nullable: true
        severity:
          type: string
          enum:
          - info
          - warning
          - error
        source:
          type: string
          nullable: true
        dismissed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - key
      - title
      - body
      - severity
      - source
      - dismissed_at
      - created_at
    Household:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - member
        active:
          type: boolean
        workflow_log_level:
          type: string
          enum:
          - none
          - info
          - debug
        include_unvested_equity:
          type: boolean
      required:
      - id
      - name
      - role
      - active
      - workflow_log_level
      - include_unvested_equity
    HouseholdMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - admin
          - member
        created_at:
          type: string
          format: date-time
        user:
          "$ref": "#/components/schemas/SessionUser"
      required:
      - id
      - role
      - created_at
      - user
    Invite:
      type: object
      properties:
        code:
          type: string
        role:
          type: string
          enum:
          - admin
          - member
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        household:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
          - id
          - name
      required:
      - code
      - role
      - expires_at
      - created_at
      - household
    SecurityConversionSecurity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticker:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
      required:
      - id
      - ticker
      - name
    SecurityConversionStatus:
      type: string
      enum:
      - suggested
      - confirmed
      - dismissed
    SecurityConversion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        from_security:
          "$ref": "#/components/schemas/SecurityConversionSecurity"
        to_security:
          "$ref": "#/components/schemas/SecurityConversionSecurity"
        effective_date:
          type: string
          format: date
        ratio:
          type: number
          format: float
          description: to_security shares per from_security share, both in current
            split-adjusted units
        status:
          "$ref": "#/components/schemas/SecurityConversionStatus"
        source:
          type: string
          enum:
          - detected
          - manual
        evidence:
          type: object
          additionalProperties: true
          description: 'What detection saw: quantities, closes, dates, account, shared
            name words'
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - from_security
      - to_security
      - effective_date
      - ratio
      - status
      - source
      - evidence
      - confirmed_at
      - created_at
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_number:
          type: string
        account_type:
          type: string
          nullable: true
        balance:
          type: number
          format: float
          nullable: true
        balance_currency:
          type: string
          nullable: true
        balance_usd:
          type: number
          format: float
          nullable: true
        broker_id:
          type: string
          format: uuid
          nullable: true
        broker_name:
          type: string
          nullable: true
        plaid_item_id:
          type: string
          format: uuid
          nullable: true
        hidden:
          type: boolean
        kind:
          type: string
          enum:
          - standard
          - external
        tax_treatment:
          type: string
          enum:
          - taxable
          - traditional_401k
          - traditional_ira
          - roth_401k
          - roth_ira
          - hsa
          - education
          - other
      required:
      - id
      - name
      - account_number
      - account_type
      - balance
      - balance_currency
      - balance_usd
      - broker_id
      - broker_name
      - plaid_item_id
      - hidden
      - kind
      - tax_treatment
    AccountWithStats:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_number:
          type: string
        account_type:
          type: string
          nullable: true
        balance:
          type: number
          format: float
          nullable: true
        balance_currency:
          type: string
          nullable: true
        balance_usd:
          type: number
          format: float
          nullable: true
        broker_id:
          type: string
          format: uuid
          nullable: true
        broker_name:
          type: string
          nullable: true
        plaid_item_id:
          type: string
          format: uuid
          nullable: true
        hidden:
          type: boolean
        kind:
          type: string
          enum:
          - standard
          - external
        tax_treatment:
          type: string
          enum:
          - taxable
          - traditional_401k
          - traditional_ira
          - roth_401k
          - roth_ira
          - hsa
          - education
          - other
        cash_transaction_count:
          type: integer
        investment_transaction_count:
          type: integer
        portfolio_value:
          type: number
          format: float
        latest_transaction_date:
          type: string
          format: date
          nullable: true
        linked_loan_id:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - name
      - account_number
      - account_type
      - balance
      - balance_currency
      - balance_usd
      - broker_id
      - broker_name
      - plaid_item_id
      - hidden
      - kind
      - tax_treatment
      - cash_transaction_count
      - investment_transaction_count
      - portfolio_value
      - latest_transaction_date
      - linked_loan_id
    AccountBalancePoint:
      type: object
      properties:
        date:
          type: string
          format: date
        balance:
          type: number
          format: float
        balance_currency:
          type: string
          nullable: true
        balance_usd:
          type: number
          format: float
          nullable: true
        source:
          type: string
          enum:
          - scheduled
          - plaid_sync
          - coinbase_sync
          - alchemy_sync
          - manual
      required:
      - date
      - balance
      - balance_currency
      - balance_usd
      - source
    AccountHoldingPosition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        security_id:
          type: string
          format: uuid
        security_ticker:
          type: string
          nullable: true
        security_name:
          type: string
          nullable: true
        security_cusip:
          type: string
          nullable: true
        security_label:
          type: string
          nullable: true
        quantity:
          type: number
          format: float
        price:
          type: number
          format: float
        market_value:
          type: number
          format: float
        cost_basis:
          type: number
          format: float
        unrealized_gl:
          type: number
          format: float
        unrealized_gl_pct:
          type: number
          format: float
        asset_class:
          type: string
          nullable: true
        est_annual_income:
          type: number
          format: float
        dividend_yield:
          type: number
          format: float
        as_of_date:
          type: string
          format: date
      required:
      - id
      - security_id
      - security_ticker
      - security_name
      - security_cusip
      - security_label
      - quantity
      - price
      - market_value
      - cost_basis
      - unrealized_gl
      - unrealized_gl_pct
      - asset_class
      - est_annual_income
      - dividend_yield
      - as_of_date
    AccountHoldings:
      type: object
      properties:
        as_of_date:
          type: string
          format: date
          description: Null when the account holds nothing
          nullable: true
        positions:
          type: array
          items:
            "$ref": "#/components/schemas/AccountHoldingPosition"
      required:
      - as_of_date
      - positions
    Broker:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        account_count:
          type: integer
      required:
      - id
      - name
      - account_count
    BrokerDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        account_count:
          type: integer
        accounts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              account_number:
                type: string
              account_type:
                type: string
                nullable: true
            required:
            - id
            - name
            - account_number
            - account_type
      required:
      - id
      - name
      - account_count
      - accounts
    TagRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    CashTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum:
          - bank
          - credit_card
        transaction_date:
          type: string
          format: date
        post_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
          nullable: true
        amount:
          type: number
          format: float
        transaction_type:
          type: string
          description: Open vocabulary — CSV importers pass bank types through verbatim
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        category_name:
          type: string
          nullable: true
        category_parent_name:
          type: string
          description: Set when the category is a subcategory
          nullable: true
        merchant_id:
          type: string
          format: uuid
          nullable: true
        merchant_name:
          type: string
          nullable: true
        account_id:
          type: string
          format: uuid
          nullable: true
        account_name:
          type: string
          nullable: true
        balance:
          type: number
          format: float
          nullable: true
        memo:
          type: string
          nullable: true
        transfer_id:
          type: string
          format: uuid
          nullable: true
        transfer_kind:
          type: string
          enum:
          - transfer
          - credit_card_payment
          - loan_payment
          nullable: true
        transfer_include_in_spend:
          type: boolean
          nullable: true
        loan_id:
          type: string
          format: uuid
          nullable: true
        loan_name:
          type: string
          nullable: true
        budget_excluded:
          type: boolean
          description: Left out of budgets (a one-off purchase); still counts in cashflow
        tags:
          type: array
          items:
            "$ref": "#/components/schemas/TagRef"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - source
      - transaction_date
      - post_date
      - description
      - amount
      - transaction_type
      - category_id
      - category_name
      - category_parent_name
      - merchant_id
      - merchant_name
      - account_id
      - account_name
      - balance
      - memo
      - transfer_id
      - transfer_kind
      - transfer_include_in_spend
      - loan_id
      - loan_name
      - budget_excluded
      - tags
      - created_at
      - updated_at
    CashTransactionFilterCount:
      type: object
      properties:
        transactions:
          type: array
          items:
            "$ref": "#/components/schemas/CashTransaction"
        total:
          type: integer
          description: Every match, not just the returned sample
      required:
      - transactions
      - total
    CashTransactionBulkUpdate:
      type: object
      properties:
        updated:
          type: integer
          description: Rows that exist in this household, whether or not any field
            changed
        account_id:
          type: string
          format: uuid
          nullable: true
        merchant_id:
          type: string
          format: uuid
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - updated
      - account_id
      - merchant_id
      - category_id
      - tag_ids
    SimilarTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transaction_date:
          type: string
          format: date
        description:
          type: string
          nullable: true
        amount:
          type: number
          format: float
        account_name:
          type: string
          nullable: true
        match:
          type: string
          enum:
          - exact
          - similar
      required:
      - id
      - transaction_date
      - description
      - amount
      - account_name
      - match
    SimilarTransactions:
      type: object
      properties:
        transactions:
          type: array
          items:
            "$ref": "#/components/schemas/SimilarTransaction"
        total:
          type: integer
          description: Every match, not just the returned slice
        total_amount:
          type: number
          format: float
      required:
      - transactions
      - total
      - total_amount
    TransactionContextRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transaction_date:
          type: string
          format: date
        description:
          type: string
          nullable: true
        amount:
          type: number
          format: float
        account_name:
          type: string
          nullable: true
        merchant_name:
          type: string
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        category_name:
          type: string
          nullable: true
        transfer_id:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - transaction_date
      - description
      - amount
      - account_name
      - merchant_name
      - category_id
      - category_name
      - transfer_id
    TransactionContextNearby:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transaction_date:
          type: string
          format: date
        description:
          type: string
          nullable: true
        amount:
          type: number
          format: float
        account_name:
          type: string
          nullable: true
        merchant_name:
          type: string
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        category_name:
          type: string
          nullable: true
        transfer_id:
          type: string
          format: uuid
          nullable: true
        date_diff:
          type: integer
          description: Days from the transaction (negative = before)
      required:
      - id
      - transaction_date
      - description
      - amount
      - account_name
      - merchant_name
      - category_id
      - category_name
      - transfer_id
      - date_diff
    TransactionContext:
      type: object
      properties:
        history:
          type: object
          properties:
            basis:
              type: string
              enum:
              - merchant
              - description
              - none
              description: What makes a row a peer
            label:
              type: string
              nullable: true
            total:
              type: integer
              description: Every peer, not just the plotted rows
            rows:
              type: array
              items:
                "$ref": "#/components/schemas/TransactionContextRow"
              description: Oldest first; always includes the transaction
          required:
          - basis
          - label
          - total
          - rows
        stats:
          type: object
          properties:
            count:
              type: integer
            ordinal:
              type: integer
              description: This row's position among its peers, oldest = 1
            median:
              type: number
              format: float
            p25:
              type: number
              format: float
            p75:
              type: number
              format: float
            min:
              type: number
              format: float
            max:
              type: number
              format: float
            percentile:
              type: number
              format: float
              description: Share of peers at or below this amount, 0..1
            ratio_to_median:
              type: number
              format: float
              nullable: true
            first_date:
              type: string
              format: date
            last_date:
              type: string
              format: date
            trailing_year_total:
              type: number
              format: float
            trailing_year_count:
              type: integer
          required:
          - count
          - ordinal
          - median
          - p25
          - p75
          - min
          - max
          - percentile
          - ratio_to_median
          - first_date
          - last_date
          - trailing_year_total
          - trailing_year_count
          nullable: true
        cadence:
          type: object
          properties:
            granularity:
              type: string
              enum:
              - week
              - month
              - year
            quantity:
              type: integer
            anchor:
              type: object
              additionalProperties: true
            description:
              type: string
            confidence:
              type: number
              format: float
            hit_rate:
              type: number
              format: float
            matched_count:
              type: integer
            missed_count:
              type: integer
            includes_transaction:
              type: boolean
            average_amount:
              type: number
              format: float
            next_expected_date:
              type: string
              format: date
            matched_ids:
              type: array
              items:
                type: string
                format: uuid
          required:
          - granularity
          - quantity
          - anchor
          - description
          - confidence
          - hit_rate
