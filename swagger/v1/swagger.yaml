      tags:
      - Net Worth
      parameters:
      - name: years
        in: query
        required: false
        description: Horizon in years (1–40, default 10)
        schema:
          type: integer
      - name: growth
        in: query
        required: false
        description: Annual growth rate as a percentage (-20–30)
        schema:
          type: number
      - name: monthly
        in: query
        required: false
        description: 'Monthly contribution (default: the recent average monthly net
