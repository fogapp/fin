            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update a workflow (steps replace the tree)
      tags:
      - Workflows
      parameters: []
      responses:
        '200':
          description: workflow updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkflowDetail"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                trigger_type:
                  type: string
                trigger_config:
                  type: object
                  additionalProperties: true
                active:
                  type: boolean
                position:
                  type: integer
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      kind:
                        "$ref": "#/components/schemas/WorkflowStepKind"
                      config:
                        type: object
                        additionalProperties: true
                      children:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                    required:
                    - kind
                    - config
                  description: Replaces the whole step tree when present
    delete:
      summary: Delete a workflow (system workflows can only be deactivated)
      tags:
      - Workflows
      responses:
        '204':
          description: workflow deleted
        '422':
          description: system workflow
  "/api/v1/workflows/{id}/run_now":
    parameters:
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    post:
      summary: Run a workflow now (monitors evaluate; others apply to existing records)
      tags:
      - Workflows
      responses:
        '202':
          description: run queued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Queued"
  "/api/v1/workflows/{id}/apply_to_existing":
    parameters:
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    post:
      summary: Apply a workflow to existing records
      tags:
      - Workflows
      responses:
        '202':
          description: apply queued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Queued"
  "/api/v1/workflows/{id}/revert_runs":
    parameters:
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    post:
      summary: Revert a workflow's runs, optionally since a time
      tags:
      - Workflows
      parameters: []
      responses:
        '202':
          description: revert queued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Queued"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                since:
                  type: string
                  format: date-time
  "/api/v1/workflow_runs":
    get:
      summary: List workflow runs (paged), or runs grouped by trace
      tags:
      - Workflow Runs
      parameters:
      - name: workflow_id
        in: query
        format: uuid
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/WorkflowRunStatus"
      - name: trace_id
        in: query
        format: uuid
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: grouped
        in: query
        required: false
        description: Any value switches the response to WorkflowRunGroupsResponse
        schema:
          type: string
      responses:
        '200':
          description: runs listed (WorkflowRunsResponse), or grouped (WorkflowRunGroupsResponse)
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/WorkflowRunsResponse"
                - "$ref": "#/components/schemas/WorkflowRunGroupsResponse"
  "/api/v1/workflow_runs/{id}":
    parameters:
